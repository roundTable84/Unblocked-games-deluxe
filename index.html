<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Unblocked Games Deluxe</title>
    <meta
      name="description"
      content="An unblocked browser games portal powered by a JSON iframe catalog with built-in HTML, CSS, and JavaScript games."
    />
    <meta property="og:title" content="Unblocked Games Deluxe" />
    <meta
      property="og:description"
      content="An unblocked browser games portal powered by a JSON iframe catalog with built-in HTML, CSS, and JavaScript games."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0F1117] text-[#F4F4F5] antialiased selection:bg-[#FF5A36]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (document.documentElement.dataset.appMounted === 'true') return;
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          var script = document.createElement('script');
          script.src = './public/gh-pages-fallback.js?v=' + Date.now();
          document.body.appendChild(script);
        }, 250);
      });
    </script>
  </body>
</html>
