<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Snake</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="title">
    <main class="shell">
      <header class="hud" aria-label="Game status">
        <div class="stat-group">
          <div class="stat">
            <span class="kicker">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="kicker">Best</span>
            <span id="best" class="value">0</span>
          </div>
          <div class="stat">
            <span class="kicker">Speed</span>
            <span id="speed" class="value">1x</span>
          </div>
        </div>
        <div class="actions">
          <button id="muteBtn" class="icon-btn" type="button" title="Toggle sound (M)" aria-label="Toggle sound">Sound On</button>
          <button id="pauseBtn" class="icon-btn" type="button" title="Pause game (P)" aria-label="Pause game">Pause</button>
          <button id="restartBtn" class="icon-btn" type="button" title="Restart game (R)" aria-label="Restart game">Restart</button>
        </div>
      </header>

      <div class="stage-wrap">
        <canvas id="board" width="560" height="400" aria-label="Grid Snake game board"></canvas>

        <section id="titleOverlay" class="overlay" aria-label="Title screen">
          <div class="modal-card">
            <h1>Grid Snake</h1>
            <p class="subtitle">Collect amber energy cubes to grow. Avoid walls and your own tail.</p>
            <button id="startBtn" class="primary-btn" type="button" data-start="true">Start Game</button>
            <p class="controls-hint">Arrow Keys or WASD to steer · P to pause · R to restart</p>
          </div>
        </section>

        <section id="pauseOverlay" class="overlay hidden" aria-label="Paused">
          <div class="modal-card">
            <h2>Paused</h2>
            <p class="subtitle">Take a breather before jumping back onto the grid.</p>
            <div class="btn-row">
              <button id="resumeBtn" class="primary-btn" type="button">Resume</button>
              <button id="pauseRestartBtn" class="secondary-btn" type="button">Restart</button>
            </div>
          </div>
        </section>

        <section id="gameOverOverlay" class="overlay hidden" aria-label="Game over">
          <div class="modal-card">
            <h2>Run Ended</h2>
            <div class="summary-grid">
              <div class="summary-tile">
                <span class="kicker">Final Score</span>
                <span id="finalScore" class="value">0</span>
              </div>
              <div class="summary-tile">
                <span class="kicker">Best Score</span>
                <span id="finalBest" class="value">0</span>
              </div>
            </div>
            <button id="retryBtn" class="primary-btn" type="button" data-start="true">Play Again</button>
          </div>
        </section>
      </div>

      <div class="touch-pad" aria-label="Directional controls">
        <button type="button" class="pad-btn" data-dir="up" aria-label="Move up">▲</button>
        <div class="pad-row">
          <button type="button" class="pad-btn" data-dir="left" aria-label="Move left">◀</button>
          <button type="button" class="pad-btn" data-dir="down" aria-label="Move down">▼</button>
          <button type="button" class="pad-btn" data-dir="right" aria-label="Move right">▶</button>
        </div>
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
