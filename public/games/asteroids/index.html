<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroids Drift</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="title">
    <main class="shell">
      <header class="hud">
        <div class="stat-group">
          <div class="stat">
            <span class="kicker">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="kicker">Wave</span>
            <span id="wave" class="value">1</span>
          </div>
          <div class="stat">
            <span class="kicker">Hull</span>
            <span id="lives" class="value">3</span>
          </div>
        </div>
        <div class="actions">
          <button id="muteBtn" class="icon-btn" type="button">Sound On</button>
          <button id="pauseBtn" class="icon-btn" type="button">Pause</button>
          <button id="restartBtn" class="icon-btn" type="button">Restart</button>
        </div>
      </header>

      <div class="stage-wrap">
        <canvas id="board" width="640" height="420" aria-label="Asteroids Drift space arena"></canvas>

        <section id="titleOverlay" class="overlay">
          <div class="modal-card">
            <h1>Asteroids Drift</h1>
            <p class="subtitle">Rotate, fire thrusters, and blast drifting space rocks into fragments.</p>
            <button id="startBtn" class="primary-btn" type="button" data-start="true">Launch Ship</button>
            <p class="controls-hint">A/D or Left/Right Rotate · W/Up Thrust · Space Fire</p>
          </div>
        </section>

        <section id="pauseOverlay" class="overlay hidden">
          <div class="modal-card">
            <h2>Paused</h2>
            <p class="subtitle">Thrusters on standby.</p>
            <div class="btn-row">
              <button id="resumeBtn" class="primary-btn" type="button">Resume</button>
              <button id="pauseRestartBtn" class="secondary-btn" type="button">Restart</button>
            </div>
          </div>
        </section>

        <section id="gameOverOverlay" class="overlay hidden">
          <div class="modal-card">
            <h2>Ship Destroyed</h2>
            <div class="summary-grid">
              <div class="summary-tile">
                <span class="kicker">Final Score</span>
                <span id="finalScore" class="value">0</span>
              </div>
              <div class="summary-tile">
                <span class="kicker">Wave Reached</span>
                <span id="finalWave" class="value">1</span>
              </div>
            </div>
            <button id="retryBtn" class="primary-btn" type="button" data-start="true">Play Again</button>
          </div>
        </section>
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
