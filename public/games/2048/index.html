<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 Tiles</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="playing">
    <main class="shell">
      <header class="hud">
        <div class="stat-group">
          <div class="stat">
            <span class="kicker">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="kicker">Best</span>
            <span id="best" class="value">0</span>
          </div>
        </div>
        <div class="actions">
          <button id="undoBtn" class="icon-btn" type="button">Undo</button>
          <button id="restartBtn" class="icon-btn" type="button">New Game</button>
        </div>
      </header>

      <div class="board-wrap">
        <div id="grid" class="grid" role="grid" aria-label="2048 game board"></div>

        <section id="endOverlay" class="overlay hidden" aria-label="Game status">
          <div class="modal-card">
            <h2 id="endTitle">No Moves Left</h2>
            <p id="endDesc" class="subtitle">Final Score: <strong id="finalScore">0</strong></p>
            <div class="btn-row">
              <button id="keepPlayingBtn" class="secondary-btn hidden" type="button">Keep Playing</button>
              <button id="playAgainBtn" class="primary-btn" type="button" data-start="true">Play Again</button>
            </div>
          </div>
        </section>
      </div>

      <p class="hint">Use Arrow Keys, WASD, or swipe to merge matching tiles to 2048.</p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
