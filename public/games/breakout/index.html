<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Breaker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="title">
    <main class="shell">
      <header class="hud">
        <div class="stat-group">
          <div class="stat">
            <span class="kicker">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="kicker">Stage</span>
            <span id="stage" class="value">1</span>
          </div>
          <div class="stat">
            <span class="kicker">Lives</span>
            <span id="lives" class="value">3</span>
          </div>
        </div>
        <div class="actions">
          <button id="muteBtn" class="icon-btn" type="button">Sound On</button>
          <button id="pauseBtn" class="icon-btn" type="button">Pause</button>
          <button id="restartBtn" class="icon-btn" type="button">Restart</button>
        </div>
      </header>

      <div class="stage-wrap">
        <canvas id="board" width="600" height="420" aria-label="Brick Breaker canvas"></canvas>

        <section id="titleOverlay" class="overlay">
          <div class="modal-card">
            <h1>Brick Breaker</h1>
            <p class="subtitle">Bounce the kinetic ball to smash every brick row. Catch emerald drops to widen your paddle.</p>
            <button id="startBtn" class="primary-btn" type="button" data-start="true">Start Game</button>
            <p class="controls-hint">Move mouse or use A / D / Arrow Keys · P to pause</p>
          </div>
        </section>

        <section id="pauseOverlay" class="overlay hidden">
          <div class="modal-card">
            <h2>Paused</h2>
            <p class="subtitle">Ball trajectory held safely in place.</p>
            <div class="btn-row">
              <button id="resumeBtn" class="primary-btn" type="button">Resume</button>
              <button id="pauseRestartBtn" class="secondary-btn" type="button">Restart</button>
            </div>
          </div>
        </section>

        <section id="gameOverOverlay" class="overlay hidden">
          <div class="modal-card">
            <h2 id="endTitle">Game Over</h2>
            <div class="summary-grid">
              <div class="summary-tile">
                <span class="kicker">Final Score</span>
                <span id="finalScore" class="value">0</span>
              </div>
              <div class="summary-tile">
                <span class="kicker">Stage Reached</span>
                <span id="finalStage" class="value">1</span>
              </div>
            </div>
            <button id="retryBtn" class="primary-btn" type="button" data-start="true">Play Again</button>
          </div>
        </section>
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
