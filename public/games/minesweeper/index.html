<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper Classic</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="playing">
    <main class="shell">
      <header class="hud">
        <div class="stat-group">
          <div class="stat">
            <span class="kicker">Mines Left</span>
            <span id="minesLeft" class="value">10</span>
          </div>
          <div class="stat">
            <span class="kicker">Time</span>
            <span id="timer" class="value">0s</span>
          </div>
        </div>
        <div class="actions">
          <button id="flagModeBtn" class="icon-btn" type="button">Flag Mode: Off</button>
          <select id="difficultySelect" class="select-input" aria-label="Board difficulty">
            <option value="easy">9x9 (10)</option>
            <option value="medium">12x12 (22)</option>
          </select>
          <button id="restartBtn" class="icon-btn" type="button">New Board</button>
        </div>
      </header>

      <div class="board-wrap">
        <div id="grid" class="grid" role="grid" aria-label="Minesweeper grid"></div>

        <section id="endOverlay" class="overlay hidden" aria-label="Game result">
          <div class="modal-card">
            <h2 id="endTitle">Board Cleared</h2>
            <p id="endDesc" class="subtitle">Finished in <strong id="finalTime">0s</strong></p>
            <button id="playAgainBtn" class="primary-btn" type="button" data-start="true">Play Again</button>
          </div>
        </section>
      </div>

      <p class="hint">Left click to reveal · Right click (or Flag Mode) to mark mines.</p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
